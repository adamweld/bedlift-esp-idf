# EIM install settings for this repo (ESP-IDF v5.5.1). Replay with:
#   eim install -c eim_config.toml -p ~/.espressif
# Machine-specific paths are left out; EIM derives them from -p, so the IDF,
# tools, eim_idf.json and activate_idf_v5.5.1.sh all land under ~/.espressif
# (where activate_idf.sh looks). The IDF venv is built on Python 3.12 (see
# README Prerequisites).
target = ["all"]
idf_versions = ["v5.5.1"]
tools_json_file = "tools/tools.json"
non_interactive = true
wizard_all_questions = false
mirror = "https://dl.espressif.com/github_assets"
idf_mirror = "https://github.com"
pypi_mirror = "https://pypi.org/simple"
recurse_submodules = true
install_all_prerequisites = true
skip_prerequisites_check = false
cleanup = false
skip_components_download = false
python_env_folder_name = "python"
python_version_override = "python312"
create_bat_activation_script = false

[idf_features_per_version]
"v5.5.1" = ["core"]

[idf_tools_per_version]
"v5.5.1" = ["xtensa-esp-elf-gdb", "riscv32-esp-elf-gdb", "xtensa-esp-elf", "esp-clang", "esp-clang-libs", "riscv32-esp-elf", "esp32ulp-elf", "cmake", "openocd-esp32", "ninja", "esp-rom-elfs"]
